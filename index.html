<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5fa8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>הסידור שלי</title>
<style>
:root{--bg:#faf6ec;--fg:#1d1b16;--card:#ffffff;--line:#e3dccb;--acc:#2f5fa8;--acc3:#5584c7;--accd:#1f4682;--card2:#fbf4e2;--bg2:#f4ecd6;--acc2:#b8872b;--mut:#7a7466;--brown:#6b3b1f;--on-acc:#ffffff;--sh:0 2px 8px rgba(40,35,20,.10)}
:root[data-t=dark]{--bg:#12141a;--fg:#e9e4d6;--card:#1c1f28;--line:#2c3040;--acc:#c9a24d;--acc3:#e6c778;--accd:#a07d2a;--card2:#171a22;--bg2:#0d0f14;--acc2:#c9a24d;--mut:#8d8a80;--brown:#e0b872;--on-acc:#14110a;--sh:0 2px 10px rgba(0,0,0,.4)}
@media(prefers-color-scheme:dark){:root[data-t=auto]{--bg:#12141a;--fg:#e9e4d6;--card:#1c1f28;--line:#2c3040;--acc:#c9a24d;--acc3:#e6c778;--accd:#a07d2a;--card2:#171a22;--bg2:#0d0f14;--acc2:#c9a24d;--mut:#8d8a80;--brown:#e0b872;--on-acc:#14110a;--sh:0 2px 10px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--acc);color:#fff}
:root[data-t=dark] header{color:#12141a}
header h1{flex:1;margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.18);border:0;border-radius:10px;padding:8px 12px;color:inherit;font-size:15px}
main{padding:12px;max-width:760px;margin:auto;padding-bottom:90px}
h2.sec{font-size:15px;color:var(--mut);margin:20px 4px 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-size:15px}
.chip.star{border-color:var(--acc2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:right}
.card b{display:block;font-size:17px}
.card small{color:var(--mut);display:block;margin-top:4px}
.resume{background:var(--acc);color:#fff;border:0;width:100%;border-radius:14px;padding:16px;font-size:17px;text-align:right;margin-bottom:10px}
:root[data-t=dark] .resume{color:#12141a}
.resume small{display:block;opacity:.8;margin-top:3px;font-size:13px}
/* reader */
#reader{padding:6px 14px 120px;max-width:760px;margin:auto}
.ph{margin:30px 0 8px;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:700;color:var(--acc2);scroll-margin-top:64px}
.ph.col{cursor:pointer;color:var(--mut);background:transparent}
.ph.col .pl{color:var(--acc2);font-weight:700;margin-left:4px}
.ph.col.lg{font-size:18px;font-weight:700;padding:15px 16px;margin:12px 0;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.ph.col.lg .pl{font-size:22px;margin-left:8px}
.ph.sm{font-size:13px;font-weight:400;padding:4px 10px;margin:12px 0 6px}
.pb.hide{display:none}
.para.tp{line-height:1.4;padding:2px 4px}
.pb.tight .para{line-height:1.45;padding:2px 4px}
.closeb{display:block;margin:8px auto 4px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 18px;font-size:13px;color:var(--mut)}
.grp{margin:36px 0 6px;padding-bottom:14px;text-align:center;font-family:'Frank Ruhl Libre','David Libre',Georgia,serif;font-weight:900;font-size:1.5em;line-height:1.3;color:var(--brown);background:linear-gradient(90deg,transparent,var(--acc2),transparent) bottom/70% 2px no-repeat}
.grp .st{color:var(--acc2);font-size:.6em;margin:0 12px;vertical-align:middle}
.para{padding:6px 4px;line-height:1.85;border-radius:8px;scroll-margin-top:70px}
.para.sel{background:rgba(184,135,43,.18)}
.para.mk{border-right:4px solid var(--acc2);padding-right:8px}
.para small{font-size:.8em;color:var(--mut)}
.para small small{font-size:1em}
.para big{font-size:1.15em}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}
.ov.on{display:block}
.sheet{position:absolute;bottom:0;left:0;right:0;max-height:82vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));max-width:760px;margin:auto}
.sheet h3{margin:4px 2px 12px;font-size:17px}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row .grow{flex:1}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 14px}
:root[data-t=dark] .btn{color:#12141a}
.btn.sec{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.btn.del{background:#a33;color:#fff}
input[type=text],input[type=number]{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
.li{display:flex;align-items:center;gap:8px;padding:12px 8px;border-bottom:1px solid var(--line)}
.li .t{flex:1}
.li.g{font-weight:700;color:var(--acc2);border:0;padding-top:16px}
.fab{position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:8px}
.fab button{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:14px 18px;font-size:16px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
:root[data-t=dark] .fab button{color:#12141a}
.hl{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.hl .n{flex:1}.hl .p{min-width:56px;text-align:center;font-size:18px;font-weight:700}
.hl button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;z-index:30;display:none;font-size:14px}
.hide{display:none!important}
.thq{display:flex;gap:8px;margin:10px 0}.thq input{flex:1}
select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;margin-bottom:6px}
.thp{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:14px;color:var(--mut)}
.thpb{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}.thpb i{display:block;height:100%;background:var(--acc2)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 12px;padding-bottom:4px}
.tab{flex:none;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}:root[data-t=dark] .tab.on{color:#12141a}
.grid1{display:grid;gap:10px}.card.today{border-color:var(--acc2);box-shadow:0 0 0 2px var(--acc2) inset}
.dgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}.dgrid.wide{grid-template-columns:repeat(3,1fr)}
.dbtn{padding:12px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px}
.dbtn.today{border-color:var(--acc2);box-shadow:0 0 0 2px var(--acc2) inset}.dbtn.rd{background:rgba(184,135,43,.18)}
.thn{color:var(--mut);font-size:14px;margin:10px 2px}
.thr{max-width:760px;margin:auto;padding:4px 6px 140px}
.tht{text-align:center;font-family:'Frank Ruhl Libre',Georgia,serif;font-weight:900;font-size:1.5em;color:var(--brown);margin:14px 0 2px}.tht small{font-size:.55em;color:var(--mut);font-weight:400}
.thctx{text-align:center;color:var(--mut);font-size:13px;margin-bottom:12px}
.thv{line-height:2;margin:10px 0 24px}.tv{color:var(--acc2);font-size:.6em;margin:0 8px 0 5px;font-weight:700}
.thbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.thbar button{flex:1;padding:14px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px}
.thbar button#thNext{flex:1.6;background:var(--acc);color:#fff;border-color:var(--acc)}:root[data-t=dark] .thbar button#thNext{color:#12141a}
.thbar button#thRd.on{background:rgba(184,135,43,.25);border-color:var(--acc2)}.thbar button:disabled{opacity:.4}

/* ===== עיצוב מחודש ===== */
header{background:linear-gradient(180deg,var(--acc),var(--accd));color:var(--on-acc)!important;box-shadow:0 2px 12px rgba(0,0,0,.22)}
header button{background:rgba(255,255,255,.18);border-radius:12px;color:inherit;font-weight:600}
.btn,.thbar button#thNext,.fab button{background:linear-gradient(135deg,var(--acc),var(--accd));color:var(--on-acc)!important;border:0;border-radius:14px;font-weight:600;box-shadow:var(--sh)}
.btn{padding:12px 18px}
.btn.sec{background:var(--card);color:var(--fg)!important;border:1px solid var(--line);box-shadow:none}
.btn.del{background:linear-gradient(135deg,#b03a2e,#8c2b21);color:#fff!important}
.btn:active,.card:active,.tile:active{transform:scale(.97)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 14px;box-shadow:var(--sh);transition:transform .08s}
.card b{font-size:17px;color:var(--brown)}
.chip{border-radius:999px;box-shadow:var(--sh);background:var(--card)}
.fab button{border-radius:999px;padding:13px 18px;box-shadow:0 4px 14px rgba(60,30,10,.35)}
.resume{display:none}
.rs{display:flex;align-items:center;gap:6px;margin:0 0 12px;background:linear-gradient(135deg,var(--acc),var(--accd));border-radius:999px;padding:3px 4px 3px 10px;box-shadow:var(--sh)}
.rsb{flex:1;background:none;border:0;color:var(--on-acc);font-size:14px;font-weight:600;text-align:right;padding:9px 12px}
.rsx{background:rgba(255,255,255,.2);border:0;color:var(--on-acc);width:30px;height:30px;border-radius:50%;font-size:13px}
.sheet{border-radius:22px 22px 0 0}
.tabs{display:none}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:16px 8px;border-radius:18px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh);font-size:16px;font-weight:700;color:var(--brown);min-height:84px;transition:transform .08s}
.tile .ic{font-size:26px;line-height:1}
.tile.on{border-color:var(--acc2);background:linear-gradient(180deg,var(--card),rgba(184,135,43,.16));box-shadow:0 0 0 2px var(--acc2) inset,var(--sh)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.tiles .tile.wide{grid-column:1/-1;min-height:64px;flex-direction:row;gap:10px}
.panel{background:rgba(184,135,43,.08);border:1px solid var(--line);border-radius:18px;padding:12px;margin:0 0 16px}
.stg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stg.d6{grid-template-columns:repeat(6,1fr)}
.stl{padding:11px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:600;color:var(--fg);box-shadow:var(--sh)}
.stl.on{border-color:var(--acc2);background:rgba(184,135,43,.2)}
.stl.today{box-shadow:0 0 0 2px var(--acc2) inset}
.chs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.chb{padding:12px 2px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px;font-weight:600;color:var(--fg)}
.chb.rd{background:rgba(184,135,43,.22);border-color:var(--acc2)}
.pbar{display:flex;gap:8px;margin-top:12px}
.pli{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0;box-shadow:var(--sh)}
.pli .pn{flex:1;min-width:0}.pli .pn small{display:block;color:var(--mut);margin-top:3px;font-size:13px}
.pli button{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:14px;color:var(--fg)}
.pli button.go{background:linear-gradient(135deg,var(--acc),var(--accd));color:var(--on-acc);border:0;font-weight:600}
.minires{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.minires button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14px;color:var(--brown);font-weight:600}
.sugg,.agebox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:14px 0;box-shadow:var(--sh)}
.sugg p{margin:6px 0 12px;color:var(--mut);font-size:14px}
.cs{position:sticky;top:var(--hh,56px);z-index:4;display:flex;gap:6px;overflow-x:auto;padding:8px 10px;margin:0 -12px;background:linear-gradient(180deg,var(--bg),var(--bg2));border-bottom:1px solid var(--line);scrollbar-width:none}
.cs::-webkit-scrollbar{display:none}
.cb{flex:none;min-width:44px;padding:8px 10px;border-radius:999px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card),var(--card2));font-size:15px;font-weight:600;color:var(--fg)}
.cb.rd{background:linear-gradient(135deg,#fff3cc,#efd48a);border-color:var(--acc2)}
.cb.on{background:linear-gradient(135deg,var(--acc3) 0%,var(--acc) 50%,var(--accd) 100%);color:var(--on-acc);border-color:transparent}
.thback{position:fixed;left:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:7;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card),var(--card2));color:var(--brown);font-size:14px;font-weight:700;white-space:nowrap;max-width:calc(100vw - 24px);box-shadow:0 4px 14px rgba(40,35,20,.25)}
.thcrumb{display:none}
.crumbrow{display:none}
@media(min-width:700px){
  .thback{display:none!important}
  .crumbrow{display:block;margin:6px 0 0}
  .thcrumb{display:inline-block;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card),var(--card2));color:var(--brown);font-size:15px;font-weight:700;box-shadow:var(--sh)}
  .thbar{max-width:760px;margin:0 auto;border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}
}
.thback.low{bottom:calc(18px + env(safe-area-inset-bottom))}
.thr{padding-bottom:40px}.thr.mark{padding-bottom:140px}
.dlgov{align-items:center;justify-content:center;padding:16px;background:rgba(30,15,5,.5);backdrop-filter:blur(3px)}
.dlgov.on{display:flex}
.dlg{width:min(94vw,400px);max-height:88vh;overflow:auto;background:var(--card);color:var(--fg);border-radius:22px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.dlg select,.dlg input{font-size:17px;padding:13px;border-radius:12px}
.df.big{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.df.big>span{font-size:15px;line-height:1.5;color:var(--fg);margin-bottom:8px}
.df.big input{font-size:19px;padding:16px;min-height:58px}
.dlg h3{margin:0 0 6px;font-size:19px;color:var(--brown)}
.dlg .dm{margin:6px 0 14px;color:var(--mut);line-height:1.5}
.df{display:block;margin:10px 0}.df>span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.dbtns{display:flex;gap:10px;margin-top:18px}.dbtns .btn{flex:1}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;min-height:34px}
.dchip{display:inline-flex;align-items:center;gap:6px;background:rgba(184,135,43,.18);border:1px solid var(--acc2);border-radius:999px;padding:6px 8px 6px 12px;font-weight:600}
.dchip button{background:none;border:0;color:var(--mut);font-size:15px;padding:0 4px}

/* ===== גרדיאנטים: חיים יותר ===== */
html,body{background:var(--bg)}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed}
header{background:linear-gradient(135deg,var(--acc3) 0%,var(--acc) 45%,var(--accd) 100%);border-bottom:3px solid var(--acc2)}
.btn,.thbar button#thNext,.fab button,.pli button.go{background:linear-gradient(135deg,var(--acc3) 0%,var(--acc) 50%,var(--accd) 100%);color:var(--on-acc)!important}
.btn.sec{background:linear-gradient(180deg,var(--card),var(--card2))}
.btn.del{background:linear-gradient(135deg,#d4574a,#a53226)}
.card,.tile,.chip,.stl,.chb,.pli,.sugg,.agebox,.minires button,.thbar button{background:linear-gradient(180deg,var(--card),var(--card2))}
.thbar button#thNext{background:linear-gradient(135deg,var(--acc3) 0%,var(--acc) 50%,var(--accd) 100%)}
.tile.on,.stl.on{background:linear-gradient(135deg,#fff6d8,#f1d995);border-color:var(--acc2)}
.chb.rd,.dbtn.rd{background:linear-gradient(135deg,#fff3cc,#efd48a)}
.ph{background:linear-gradient(180deg,var(--card),var(--card2))}
.ph.col.lg{background:linear-gradient(180deg,var(--card),var(--card2))}
.panel{background:linear-gradient(180deg,rgba(184,135,43,.10),rgba(47,95,168,.07))}
.thbar{background:linear-gradient(180deg,var(--bg),var(--bg2))}
.dlg{background:linear-gradient(180deg,var(--card),var(--card2))}
.rs{background:linear-gradient(135deg,var(--acc3),var(--accd))}
.dchip{background:linear-gradient(135deg,#fff3cc,#efd48a)}
</style>
</head>
<body>
<header id="hd"><h1 id="ttl">הסידור שלי</h1><button id="bBack" class="hide">‹ בית</button><button id="bSet">⚙</button></header>

<main id="home"></main>
<div id="reader" class="hide"></div>
<main id="th" class="hide"></main>
<button class="thback hide" id="thBackF">↩ חזרה</button>
<div class="thbar hide" id="thbar"><button id="thPrev">▸ הקודם</button><button id="thRd">✓ קראתי</button><button id="thNext">קראתי והמשך ◂</button></div>
<div class="fab hide" id="fab"><button id="bTop" aria-label="לראש הדף">⬆</button><button id="bJump">☰ קפיצה</button><button id="bMark">★</button></div>

<div class="ov" id="ovJump"><div class="sheet" id="shJump"></div></div>
<div class="ov" id="ovTh"><div class="sheet" id="shTh"></div></div>
<div class="ov" id="ovSet"><div class="sheet" id="shSet"></div></div>
<div class="ov" id="ovMark"><div class="sheet" id="shMark"></div></div>
<div class="ov dlgov" id="ovDlg"><div class="dlg" id="dlgBox"></div></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="tehillim.js"></script>
<script src="th.js"></script>
<script>
const D=window.SIDDUR;
const $=s=>document.querySelector(s);
const byId=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- state ---------- */
const DEF={font:22,theme:'auto',marks:[],last:{},halacha:[{n:'קיצור שו"ע — סימן',p:1}]};
let S;
try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem('siddur')||'{}'))}catch(e){S=Object.assign({},DEF)}
const save=()=>{try{localStorage.setItem('siddur',JSON.stringify(S))}catch(e){}};
/* מתג: תג "המשך איפה שהפסקת" בדף הבית. כבוי לבקשת יצחק. ראה PROJECT.md */
const SHOW_RESUME=false;
function dlg(o){return new Promise(res=>{
  const ov=$('#ovDlg'),box=$('#dlgBox');
  const fl=(o.fields||[]).map(f=>'<label class="df'+(f.cls?' '+f.cls:'')+'"><span>'+esc(f.label||'')+'</span>'+(f.type==='select'?'<select id="df_'+f.id+'">'+f.options.map(x=>'<option value="'+esc(x[0])+'"'+(String(x[0])===String(f.value)?' selected':'')+'>'+esc(x[1])+'</option>').join('')+'</select>':'<input id="df_'+f.id+'" type="'+(f.type||'text')+'" value="'+esc(f.value==null?'':f.value)+'" placeholder="'+esc(f.placeholder||'')+'">')+'</label>').join('');
  box.innerHTML=(o.title?'<h3>'+esc(o.title)+'</h3>':'')+(o.msg?'<p class="dm">'+esc(o.msg)+'</p>':'')+fl+(o.body||'')+
    '<div class="dbtns">'+(o.cancel===false?'':'<button class="btn sec" id="dlgNo">'+esc(o.cancel||'ביטול')+'</button>')+'<button class="btn'+(o.danger?' del':'')+'" id="dlgOk">'+esc(o.ok||'אישור')+'</button></div>';
  ov.classList.add('on');if(o.onMount)o.onMount(box);
  const kd=e=>{if(e.key==='Escape')close(null);else if(e.key==='Enter'&&!o.noEnter&&e.target.tagName!=='BUTTON')ok()};
  const close=v=>{ov.classList.remove('on');ov.onclick=null;document.removeEventListener('keydown',kd);res(v)};
  const ok=()=>{let v=true;if(o.fields&&o.fields.length){v={};o.fields.forEach(f=>v[f.id]=$('#df_'+f.id).value)}
    if(o.collect){v=o.collect(box);if(v===false)return}close(v)};
  document.addEventListener('keydown',kd);
  $('#dlgOk').onclick=ok;const no=$('#dlgNo');if(no)no.onclick=()=>close(null);
  ov.onclick=e=>{if(e.target===ov)close(null)};
  const fi=box.querySelector('input,select');if(fi&&!o.noFocus)setTimeout(()=>fi.focus(),60);
})}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1800)}

/* ---------- books ---------- */
const sec=n=>D.findIndex(s=>s.title===n);
const BOOKS=[
 {id:'bsh',name:'ברכות השחר',sub:'מודה אני, ברכות השחר, ברכות התורה',secs:['Preparatory Prayers']},
 {id:'shach',name:'תפילת שחרית',sub:'',secs:['Weekday Shacharit','Additions for Shacharit']},
 {id:'bentch',name:'ברכת המזון',sub:'',secs:['Post Meal Blessing']},
 {id:'chatzot',name:'תיקון חצות',sub:'',secs:['The Midnight Rite'],more:0},
 {id:'mincha',name:'מנחה',sub:'',secs:['Weekday Mincha'],pre:['Weekday Shacharit|Petichat Eliyahu']},
 {id:'arvit',name:'ערבית',sub:'',secs:['Weekday Arvit']},
 {id:'mayin',name:'ברכת מעין שלוש',sub:'',secs:['Al Hamihya'],more:1},
 {id:'bed',name:'קריאת שמע שעל המיטה',sub:'',secs:['Bedtime Shema'],more:1},
 {id:'moon',name:'ברכת הלבנה',sub:'',secs:['Blessing of the Moon'],more:1},
 {id:'misc',name:'ברכות ותפילות שונות',sub:'תפילת הדרך ועוד',secs:['Assorted Blessings and Prayers'],more:1},
];
BOOKS.forEach(b=>{
  b.parts=[];
  (b.pre||[]).forEach(x=>{const [sn,pn]=x.split('|'),si=sec(sn),pi=D[si].parts.findIndex(q=>q.title===pn);
    b.parts.push({k:si+'.'+pi,he:D[si].parts[pi].he,grp:D[sec(b.secs[0])].he,si,pi})});
  b.secs.forEach(n=>{const si=sec(n);if(si<0)return;
    D[si].parts.forEach((p,pi)=>b.parts.push({k:si+'.'+pi,he:p.he,grp:D[si].parts.length>1||b.secs.length>1?D[si].he:null,si,pi}))});
});
/* קטעים שתמיד נפתחים סגורים: ח = כל החלק, פ = פסקה בודדת */
const COLLAPSE_PARTS=['Weekday Shacharit|Petichat Eliyahu','Weekday Shacharit|Order of Talit','Weekday Shacharit|Order of Tefillin'];
const book=id=>BOOKS.find(b=>b.id===id);
const partOf=(b,k)=>b.parts.find(p=>p.k===k);

/* מיגרציה: הסרת שורת הכותרת הכפולה הזיזה פסקאות ב-1 */
(function(){if(S.dv>=2)return;const fix=o=>{if(!o||o.k==null)return;const [si,pi]=String(o.k).split('.').map(Number);
  const p=D[si]&&D[si].parts[pi];if(p&&p.trim)o.para=Math.max(0,o.para-p.trim)};
  S.marks.forEach(fix);Object.values(S.last||{}).forEach(fix);S.dv=2;save()})();
/* תיקון עצמי: אם פסקה זזה בגלל עריכת הטקסט, הסימנייה מחפשת אותה לפי תחילת הטקסט */
(function(){const norm=t=>t.replace(/<[^>]*>/g,'').trim().slice(0,30);let ch=false;
  S.marks.forEach(m=>{if(!m.sn)return;const [si,pi]=String(m.k).split('.').map(Number),p=D[si]&&D[si].parts[pi];if(!p)return;
    if(p.paras[m.para]&&norm(p.paras[m.para])===m.sn)return;const j=p.paras.findIndex(t=>norm(t)===m.sn);if(j>=0){m.para=j;ch=true}});
  if(ch)save()})();

/* ---------- theme ---------- */
function applyTheme(){document.documentElement.dataset.t=S.theme;document.documentElement.style.setProperty('--fs',S.font+'px');
  const r=$('#reader');if(r)r.style.fontSize=S.font+'px'}

/* ---------- home ---------- */
function goMark(m){openBook(m.book,m.k,m.para)}
function renderHome(){
  $('#ttl').textContent='הסידור שלי';$('#bBack').classList.add('hide');
  $('#reader').classList.add('hide');$('#fab').classList.add('hide');$('#th').classList.add('hide');$('#thbar').classList.add('hide');$('#home').classList.remove('hide');
  let h='';
  const la=S.lastAct;
  if(SHOW_RESUME&&la&&!la.dis){let txt='',act='';
    if(la.t==='b'&&book(la.id)&&S.last[la.id]){txt='המשך איפה שהפסקת: '+book(la.id).name;act='data-resume="'+la.id+'"'}
    else if(la.t==='th'&&S.th&&S.th.cur){txt='המשך איפה שהפסקת: תהילים · מזמור '+heb(S.th.cur.seq[S.th.cur.i].c);act='data-th="homeresume"'}
    if(txt)h+='<div class="rs"><button class="rsb" '+act+'>▶ '+esc(txt)+'</button><button class="rsx" data-rsx="1" aria-label="סגור">✕</button></div>'}
  if(S.marks.length){h+='<h2 class="sec">הסימניות שלי</h2><div class="chips">'+
    S.marks.map((m,i)=>`<button class="chip star" data-m="${i}">★ ${esc(m.label)}</button>`).join('')+'</div>'}
  h+='<h2 class="sec">תפילות וברכות</h2><div class="grid">'+'<button class="card" data-th="open"><b>תהילים</b><small>קריאה, חלוקות וסימון</small></button>'+BOOKS.filter(b=>!b.more).map(b=>`<button class="card" data-b="${b.id}"><b>${esc(b.name)}</b>${b.sub?`<small>${esc(b.sub)}</small>`:''}</button>`).join('')+'</div>';
  h+='<h2 class="sec">עוד</h2><div class="grid">'+BOOKS.filter(b=>b.more).map(b=>`<button class="card" data-b="${b.id}"><b>${esc(b.name)}</b>${b.sub?`<small>${esc(b.sub)}</small>`:''}</button>`).join('')+'</div>';
  $('#home').innerHTML=h;
}
$('#home').addEventListener('click',e=>{
  const t=e.target.closest('button,.p');if(!t)return;
  if(t.dataset.rsx){S.lastAct.dis=true;save();renderHome()}
  else if(t.dataset.th==='open')openTh();
  else if(t.dataset.th==='homeresume'){T().inRead=true;openTh()}
  else if(t.dataset.resume){const l=S.last[t.dataset.resume];openBook(t.dataset.resume,l.k,l.para)}
  else if(t.dataset.m!==undefined)goMark(S.marks[+t.dataset.m]);
  else if(t.dataset.b)openBook(t.dataset.b,null,null,true);
});

/* ---------- reader ---------- */
let cur=null;
function openBook(id,k,para,fresh){
  const b=book(id);cur={id};S.lastBook=id;S.lastAct={t:'b',id:id};S.open=id;save();
  $('#home').classList.add('hide');const r=$('#reader');r.classList.remove('hide');$('#fab').classList.remove('hide');
  $('#ttl').textContent=b.name;$('#bBack').textContent='‹ בית';$('#bBack').classList.remove('hide');
  let h='',lastGrp=null;
  b.parts.forEach(p=>{
    if(p.grp&&p.grp!==lastGrp){h+=`<div class="grp"><span class="st">✦</span>${esc(p.grp.replace('לימי החול','לימות החול'))}<span class="st">✦</span></div>`;lastGrp=p.grp}
    const pk=D[p.si].title+'|'+D[p.si].parts[p.pi].title, big=!!D[p.si].colAll, cp=big||COLLAPSE_PARTS.includes(pk), blocks=D[p.si].parts[p.pi].blocks||[];
    const tog=(t,tight,lg)=>`<div class="ph ${lg?'col lg':'sm col'}"><span class="pl">＋</span> ${esc(t)}</div><div class="pb hide${tight?' tight':''}">`, cls='<button class="closeb">− סגירה</button></div>';
    if(cp)h+=tog(p.he,false,big).replace(/^<div class="ph ([^"]*)">/,(m,c)=>'<div class="ph '+c+'" id="p'+p.k+'">');
    else if(D[p.si].parts[p.pi].noHead)h+=`<div id="p${p.k}"></div>`;
    else h+=`<div class="ph" id="p${p.k}">${esc(p.he)}</div>`;
    D[p.si].parts[p.pi].paras.forEach((t,i)=>{
      const bs=blocks.find(x=>x.from===i);if(bs)h+=tog(bs.title,bs.tight);
      h+=`<div class="para${(D[p.si].parts[p.pi].tightParas||[]).includes(i)?' tp':''}" id="q${p.k}_${i}" data-k="${p.k}" data-i="${i}">${t}</div>`;
      if(blocks.some(x=>x.to===i))h+=cls});
    if(cp)h+=cls;
  });
  r.innerHTML=h;applyTheme();paintMarks();
  const target=k?(para!=null?byId('q'+k+'_'+para):byId('p'+k)):null;
  if(target)reveal(target);
  if(target){target.scrollIntoView({block:'start'});if(para!=null){target.classList.add('sel');setTimeout(()=>target.classList.remove('sel'),1800)}}
  else if(!k&&!fresh&&S.last[id]){const l=S.last[id],t=byId('q'+l.k+'_'+l.para);if(t){reveal(t);t.scrollIntoView({block:'start'})}}
  else window.scrollTo(0,0);
  history.pushState({r:1},'');
}
function paintMarks(){
  document.querySelectorAll('.para.mk').forEach(e=>e.classList.remove('mk'));
  S.marks.forEach(m=>{if(m.book===cur?.id&&m.para!=null){const e=byId('q'+m.k+'_'+m.para);if(e)e.classList.add('mk')}})}
function topPara(){
  const ps=document.querySelectorAll('#reader .para');
  for(const e of ps){if(e.getBoundingClientRect().bottom>70)return e}
}
let st;window.addEventListener('scroll',()=>{if(!cur||$('#reader').classList.contains('hide'))return;clearTimeout(st);
  st=setTimeout(()=>{const e=topPara();if(e){S.last[cur.id]={k:e.dataset.k,para:+e.dataset.i};save()}},300)},{passive:true});
function leave(){cur=null;S.open=null;save();renderHome();window.scrollTo(0,0)}
$('#bBack').onclick=()=>{if(thOpen){thHome();return}
  if(history.state&&history.state.r)history.back();else leave()};
window.addEventListener('popstate',()=>{if(thOpen)thPopEvt();else if(cur)leave()});

function setOpen(tog,open){tog.nextElementSibling.classList.toggle('hide',!open);tog.querySelector('.pl').textContent=open?'−':'＋'}
function reveal(el){
  if(el.classList.contains('col')){setOpen(el,true);return}
  const pb=el.closest('.pb.hide');if(pb)setOpen(pb.previousElementSibling,true)}
$('#reader').addEventListener('click',e=>{const cb=e.target.closest('.closeb');if(cb){const t=cb.closest('.pb').previousElementSibling;setOpen(t,false);if(t.getBoundingClientRect().top<70||t.getBoundingClientRect().top>innerHeight)t.scrollIntoView({block:'center'});return}
  const c=e.target.closest('.col');if(!c)return;
  const open=c.nextElementSibling.classList.contains('hide');setOpen(c,open);
  if(!open&&c.getBoundingClientRect().top<70)c.scrollIntoView({block:'start'})});
/* tap paragraph -> add mark */
let selEl=null;
$('#reader').addEventListener('click',e=>{
  const p=e.target.closest('.para');if(!p)return;
  if(selEl)selEl.classList.remove('sel');selEl=p;p.classList.add('sel')});
$('#bTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
$('#bMark').onclick=()=>{
  const e=selEl||topPara();if(!e){return}
  const b=book(cur.id),part=partOf(b,e.dataset.k);
  const ex=S.marks.findIndex(m=>m.book===cur.id&&m.k===e.dataset.k&&m.para==+e.dataset.i);
  const snippet=e.textContent.trim().slice(0,60);
  $('#shMark').innerHTML=`<h3>סימנייה חדשה</h3>
   <p style="color:var(--mut);margin:0 0 10px">${esc(part.he)} — ${esc(snippet)}…</p>
   <input type="text" id="mkLabel" value="${esc(ex>=0?S.marks[ex].label:part.he)}">
   <div class="row"><button class="btn grow" id="mkSave">שמירת סימנייה</button>
   ${ex>=0?'<button class="btn del" id="mkDel">מחיקה</button>':''}<button class="btn sec" id="mkX">ביטול</button></div>
   <p style="color:var(--mut);font-size:13px">טיפ: לחיצה על פסקה מסמנת אותה, ואז ★ שומר בדיוק את המקום הזה. בלי סימון תישמר הפסקה שבראש המסך.</p>`;
  $('#ovMark').classList.add('on');
  $('#mkX').onclick=()=>$('#ovMark').classList.remove('on');
  $('#mkSave').onclick=()=>{const label=$('#mkLabel').value.trim()||part.he;
    const m={book:cur.id,k:e.dataset.k,para:+e.dataset.i,label,sn:e.textContent.trim().slice(0,30)};
    if(ex>=0)S.marks[ex]=m;else S.marks.push(m);save();paintMarks();$('#ovMark').classList.remove('on');toast('נשמר ★')};
  if(ex>=0)$('#mkDel').onclick=()=>{S.marks.splice(ex,1);save();paintMarks();$('#ovMark').classList.remove('on')};
};
document.querySelectorAll('.ov').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('on')}));

/* jump sheet */
$('#bJump').onclick=()=>{
  const b=book(cur.id);let h=`<h3>קפיצה — ${esc(b.name)}</h3>`;
  const mk=S.marks.map((m,i)=>({m,i})).filter(x=>x.m.book===cur.id);
  if(mk.length){h+='<div class="li g">★ הסימניות שלי</div>'+mk.map(x=>`<div class="li" data-mk="${x.i}"><span class="t">★ ${esc(x.m.label)}</span></div>`).join('')}
  let lg=null;
  b.parts.forEach(p=>{if(D[p.si].parts[p.pi].noHead)return;if(p.grp&&p.grp!==lg){h+=`<div class="li g">${esc(p.grp)}</div>`;lg=p.grp}
    h+=`<div class="li" data-pk="${p.k}"><span class="t">${esc(p.he)}</span></div>`});
  $('#shJump').innerHTML=h;$('#ovJump').classList.add('on')};
$('#shJump').addEventListener('click',e=>{const t=e.target.closest('.li');if(!t)return;
  $('#ovJump').classList.remove('on');
  if(t.dataset.mk!==undefined){const m=S.marks[+t.dataset.mk];const x=byId('q'+m.k+'_'+m.para);if(x){reveal(x);x.scrollIntoView({block:'start'})}}
  else if(t.dataset.pk){const x=byId('p'+t.dataset.pk);reveal(x);x.scrollIntoView({block:'start'})}});

/* settings */
$('#bSet').onclick=()=>{
  let h=`<h3>הגדרות</h3>
  <div class="row"><span class="grow">גודל גופן</span><button class="btn sec" id="fm">א−</button><b id="fv">${S.font}</b><button class="btn sec" id="fp">א+</button></div>
  <div class="row"><span class="grow">מצב תצוגה</span>
   <button class="btn ${S.theme==='auto'?'':'sec'}" data-th="auto">אוטו</button>
   <button class="btn ${S.theme==='light'?'':'sec'}" data-th="light">בהיר</button>
   <button class="btn ${S.theme==='dark'?'':'sec'}" data-th="dark">כהה</button></div>
  <h3 style="margin-top:18px">ניהול סימניות</h3>`;
  if(!S.marks.length)h+='<p style="color:var(--mut)">אין עדיין סימניות. בתוך תפילה: לחיצה על פסקה ואז ★.</p>';
  S.marks.forEach((m,i)=>{const b=book(m.book);h+=`<div class="li"><span class="t">${esc(m.label)}<br><small style="color:var(--mut)">${esc(b?b.name:'')}</small></span>
    <button class="btn sec" data-up="${i}">↑</button><button class="btn sec" data-rn="${i}">✎</button><button class="btn del" data-rm="${i}">✕</button></div>`});
  h+=`<h3 style="margin-top:18px">גיבוי</h3><div class="row"><button class="btn sec grow" id="exp">ייצוא</button><button class="btn sec grow" id="imp">ייבוא</button></div>
   <div class="row"><button class="btn grow" id="cl">סגירה</button></div>`;
  $('#shSet').innerHTML=h;$('#ovSet').classList.add('on')};
$('#shSet').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  const re=()=>$('#bSet').click();
  if(t.id==='fm'||t.id==='fp'){S.font=Math.min(40,Math.max(14,S.font+(t.id==='fp'?2:-2)));save();applyTheme();$('#fv').textContent=S.font}
  else if(t.dataset.th){S.theme=t.dataset.th;save();applyTheme();re()}
  else if(t.dataset.rm!==undefined){S.marks.splice(+t.dataset.rm,1);save();re();paintMarks();if(!cur)renderHome()}
  else if(t.dataset.rn!==undefined){const m=S.marks[+t.dataset.rn];dlg({title:'שינוי שם סימנייה',fields:[{id:'n',label:'שם',value:m.label}],ok:'שמירה'}).then(v=>{if(v&&v.n.trim()){m.label=v.n.trim();save();re();if(!cur)renderHome()}})}
  else if(t.dataset.up!==undefined){const i=+t.dataset.up;if(i>0){[S.marks[i-1],S.marks[i]]=[S.marks[i],S.marks[i-1]];save();re();if(!cur)renderHome()}}
  else if(t.id==='cl'){$('#ovSet').classList.remove('on');if(!cur)renderHome()}
  else if(t.id==='exp'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='siddur-backup.json';a.click()}
  else if(t.id==='imp'){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const f=i.files[0];if(!f)return;f.text().then(x=>{try{S=Object.assign({},DEF,JSON.parse(x));save();location.reload()}catch(_){toast('קובץ לא תקין')}})};i.click()}
});

applyTheme();history.replaceState({h:1},'');
if(S.open==='th')openTh();else if(S.open&&book(S.open))openBook(S.open);else renderHome();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
